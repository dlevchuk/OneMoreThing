<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d0a" />
  <title>Дошка контрактів</title>
  <meta name="description" content="Досьє, бажані речі й маршрути до продавців." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
  <link rel="stylesheet" href="theme.css?v=3" />
  <script>
    if (new URLSearchParams(window.location.search).get('transition') === 'matrix') {
      document.documentElement.classList.add('matrix-arriving');
    }
  </script>
</head>

<body class="board-page">
  <div class="matrix-rain-transition" id="matrix-arriving-veil" aria-hidden="true">
    <div class="matrix-transition-shade"></div>
    <canvas class="matrix-transition-canvas"></canvas>
  </div>
  <div class="ambient ambient--one" aria-hidden="true"></div>
  <div class="ambient ambient--two" aria-hidden="true"></div>

  <main id="top">
    <div class="ticker" aria-hidden="true">
      <div class="ticker-track">
        <span></span>
        <span></span>
      </div>
    </div>

    <section class="quest-section" id="quests" aria-labelledby="quest-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow"><span></span>ДОСТУПНІ КОНТРАКТИ</p>
          <h1 id="quest-heading">Контракти</h1>
          <p class="section-subtitle">Вибери запис — досьє розгорнеться в кіберпросторі.</p>
        </div>
        <span class="page-count" id="page-count" aria-live="polite">0 контрактів</span>
      </div>

      <div class="quest-controls">
        <div class="tabs-group">
          <span class="tabs-label" aria-hidden="true">Вкладки //</span>
          <nav class="header-nav" role="group" aria-label="Категорії">
            <button class="filter-btn filter-btn--want active" data-filter="want" id="filter-want" aria-pressed="true"
              aria-controls="wishlist-grid">
              <span class="ice-indicator" aria-hidden="true">
                <span class="ice-led ice-led--want"></span>
                <span class="ice-bars ice-bars--want">▮▮▮</span>
              </span>
              <span class="filter-label">Червона пігулка</span>
              <span class="filter-count" data-count-for="want"></span>
            </button>
            <button class="filter-btn filter-btn--nice" data-filter="nice" id="filter-nice" aria-pressed="false"
              aria-controls="wishlist-grid">
              <span class="ice-indicator" aria-hidden="true">
                <span class="ice-led ice-led--nice"></span>
                <span class="ice-bars ice-bars--nice">▮▮▯</span>
              </span>
              <span class="filter-label">Чистий лід</span>
              <span class="filter-count" data-count-for="nice"></span>
            </button>
            <button class="filter-btn filter-btn--unsure" data-filter="unsure" id="filter-unsure" aria-pressed="false"
              aria-controls="wishlist-grid">
              <span class="ice-indicator" aria-hidden="true">
                <span class="ice-led ice-led--unsure"></span>
                <span class="ice-bars ice-bars--unsure">▮▯▯</span>
              </span>
              <span class="filter-label">Мертвий канал</span>
              <span class="filter-count" data-count-for="unsure"></span>
            </button>
          </nav>
        </div>
        <div class="search-wrap">
          <label for="search-input" class="sr-only">Пошук у мережі</label>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input type="search" id="search-input" class="search-input" placeholder="Зламати ICE… знайти запис"
            aria-label="Пошук у контрактах" />
        </div>
      </div>

      <div class="board-layout">
        <div class="wishlist-grid" id="wishlist-grid" role="list" aria-label="Контракти на бажані речі"></div>
        <aside class="quest-details" id="quest-details" aria-label="Вибраний контракт"></aside>
      </div>
      <div class="empty-state" id="empty-state" hidden role="status">
        <p class="empty-icon" aria-hidden="true">✧</p>
        <p class="empty-title">Мертвий канал. Лише білий шум.</p>
        <p class="empty-sub">ICE не пропустив запит. Спробуй інші ключові слова, ковбою.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Архів веде <strong>оператор</strong></p>
    <span class="footer-note">ДОСТУП ДО ЗАПИСІВ — ЛИШЕ У ВЛАСНИКА РЕПОЗИТОРІЮ</span>
  </footer>

  <script src="rain.js"></script>
  <script src="app.js"></script>
  <script src="transition.js"></script>
</body>

</html>
