name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site into dist/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir dist
          touch dist/.nojekyll

          # Лише те, що реально потрібно сайту
          cp index.html board.html dist/
          cp style.css theme.css booking.css dist/
          cp rain.js transition.js birthday.js app.js booking.js dist/
          cp favicon.svg apple-touch-icon.png og.png dist/
          cp -r data dist/data
          if [ -d img ]; then cp -r img dist/img; fi

          # Кеш-бастінг: ?v=<будь-що> -> ?v=<sha коміту>
          sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${GITHUB_SHA::8}/g" dist/*.html

          # Абсолютні URL для og:image / og:url
          sed -i "s|__SITE_URL__|${BASE_URL%/}|g" dist/*.html

          # Конфіг Supabase (jq екранує спецсимволи в значеннях)
          {
            echo "/* Згенеровано GitHub Actions */"
            printf 'window.SUPABASE_CONFIG = %s;\n' \
              "$(jq -nc --arg url "${SUPABASE_URL:-}" --arg anonKey "${SUPABASE_ANON_KEY:-}" '{url:$url, anonKey:$anonKey}')"
          } > dist/supabase-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4