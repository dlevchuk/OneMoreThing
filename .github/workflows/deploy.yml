name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Права доступу для публікації на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Дозволити лише одне активне розгортання одночасно
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Supabase Config from Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat <<EOF > supabase-config.js
          /**
           * Автоматично згенеровано через GitHub Actions під час деплою.
           */
          window.SUPABASE_CONFIG = {
            url: "${SUPABASE_URL:-}",
            anonKey: "${SUPABASE_ANON_KEY:-}"
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

