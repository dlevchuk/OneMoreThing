name: Add wishlist card from URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: Product page URL
        required: true
        type: string
      priority:
        description: Priority
        type: choice
        options: [unsure, want, nice]
        default: unsure

permissions:
  contents: write
  actions: write

concurrency:
  group: wishlist-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import product and synchronize catalog
        env:
          PRODUCT_URL: ${{ inputs.url }}
          PRIORITY: ${{ inputs.priority }}
        run: python3 -B scripts/add-wish.py --priority "$PRIORITY" -- "$PRODUCT_URL"
      - name: Validate
        run: |
          npm test
          python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Publish card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- data/wishes.json supabase/schema.sql
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Wishlist importer'
          git config user.email 'wishlist-importer@users.noreply.github.com'
          git commit -m 'Add wishlist card from product URL'
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
