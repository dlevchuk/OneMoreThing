name: Add wishlist card from URL

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: Product page URL (leave empty when processing queue)
        required: false
        type: string
      priority:
        description: Priority
        type: choice
        options: [unsure, want, nice]
        default: unsure
      allow_unmonitored:
        description: Add without monitoring if the price cannot be parsed
        type: boolean
        default: false
      process_queue:
        description: Process one pending owner request instead of a manual URL
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: wishlist-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Порожня черга (найчастіший випадок) потребує лише scripts/. Node вже є на runner.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - name: Prepare manual or owner import
        id: request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCT_URL: ${{ inputs.url }}
          PRIORITY: ${{ inputs.priority }}
          ALLOW_UNMONITORED: ${{ inputs.allow_unmonitored }}
          PROCESS_QUEUE: ${{ inputs.process_queue }}
        run: node scripts/prepare-wish-import.mjs
      - name: Fetch the full repository
        if: steps.request.outputs.has_request == 'true'
        run: git sparse-checkout disable
      - name: Import product
        if: steps.request.outputs.has_request == 'true'
        run: node scripts/import-prepared-wish.mjs
      - name: Validate
        if: steps.request.outputs.has_request == 'true'
        run: npm test
      - name: Publish card
        if: steps.request.outputs.has_request == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- data/wishes.json
          git config user.name 'Wishlist importer'
          git config user.email 'wishlist-importer@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Add wishlist card from product URL'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          gh workflow run deploy.yml --ref main
      - name: Update owner request status
        if: always() && steps.request.outputs.queued == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          IMPORT_RESULT: ${{ job.status }}
        run: node scripts/finish-wish-import.mjs
