<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneMoreThing — список хотілок</title>
  <meta name="description" content="Речі, без яких я якось виживаю. Поки що." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <a href="#" class="logo" aria-label="OneMoreThing — на головну">
        OneMoreThing
      </a>
      <nav class="header-nav" role="navigation" aria-label="Фільтри пріоритету">
        <button class="filter-btn active" data-filter="all" id="filter-all">Усе цікаве</button>
        <button class="filter-btn" data-filter="want" id="filter-want">Хочу. Дуже.</button>
        <button class="filter-btn" data-filter="nice" id="filter-nice">Було б файно</button>
        <button class="filter-btn" data-filter="unsure" id="filter-unsure">Поки вагаюсь</button>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main" id="main-content">

    <!-- Page title + search -->
    <div class="page-top">
      <div class="page-title-group">
        <div class="page-heading">
          <h1 class="page-title">Мої хотілки</h1>
          <p class="page-subtitle">Речі, без яких я якось виживаю. Поки що.</p>
        </div>
          <span class="page-count" id="page-count" aria-live="polite">0 забаганок</span>
      </div>
      <div class="search-wrap">
        <label for="search-input" class="sr-only">Пошук</label>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Знайти наступну спокусу…"
          aria-label="Знайти бажання"
        />
      </div>
    </div>

    <!-- Grid -->
    <div class="wishlist-grid" id="wishlist-grid" role="list" aria-live="polite" aria-label="Картки бажань"></div>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state" hidden role="status">
      <p class="empty-icon" aria-hidden="true">—</p>
      <p class="empty-title">Поки що порожньо. Тримаюсь молодцем.</p>
      <p class="empty-sub">Гаманець може видихнути. Це ненадовго.</p>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer" role="contentinfo">
    <span>OneMoreThing · список фінансових спокус</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
